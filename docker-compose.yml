version: '3.8'  # Docker Compose file format version

services:
  # PostgreSQL database service
  postgres:
    image: postgres:15  # Using the official PostgreSQL 15 image
    container_name: postgres_db  # Custom name for the container
    restart: always  # Always restart the container if it crashes
    environment:
      POSTGRES_USER: ${POSTGRES_USER}  # DB username, loaded from .env file
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}  # DB password from .env file
      POSTGRES_DB: ${POSTGRES_DB}  # Default database name, also from .env
    ports:
      - "${POSTGRES_PORT}:5432"  # Maps host port (from .env) to container port 5432
    volumes:
      - pgdata:/var/lib/postgresql/data  # Mounts volume for persistent DB storage

  # pgAdmin service for managing PostgreSQL with a GUI
  pgadmin:
    image: dpage/pgadmin4  # Official pgAdmin 4 image
    container_name: pgadmin  # Container name
    restart: always  # Restart if container stops unexpectedly
    depends_on:
      - postgres  # Ensure PostgreSQL is started first
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}  # Admin email for pgAdmin login
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}  # Password for pgAdmin login
    ports:
      - "${PGADMIN_PORT}:80"  # Map container port 80 to host (UI access via this port)

  # Redis service for caching, session, queueing, etc.
  redis:
    image: redis:7  # Official Redis version 7 image
    container_name: redis_cache  # Name the Redis container
    restart: always  # Always restart on failure
    ports:
      - "${REDIS_PORT}:6379"  # Map host Redis port to container's default port
    volumes:
      - redisdata:/data  # Store Redis data persistently
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]  # Start Redis with password protection

# Named volumes for persistent storage
volumes:
  pgdata:  # Volume for PostgreSQL database
  redisdata:  # Volume for Redis data
